global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["srge-node-exporter:9100"]

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["srge-litellm:4000"]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["qwen38:8000"]

  - job_name: control-api
    metrics_path: /metrics
    static_configs:
      - targets: ["srge-control-api:8001"]

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets: ["srge-caddy:8080"]
